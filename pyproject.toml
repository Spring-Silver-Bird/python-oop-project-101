[tool.poetry]
name = "hexlet-code"
version = "0.1.0"
description = "A library for validating any type of data. Such libraries exist in every programming language, as almost all programs process external data (primarily form data) that requires validation."
authors = ["Spring-Silver-Bird <adelaida_19@mail.ru>"]
readme = "README.md"


[tool.poetry.dependencies]
python = "^3.12"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.16.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["validator"]
